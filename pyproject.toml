[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixpick"
version = "0.2.5"
description = "Draw on the frame. Get the coordinates back in Python."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["computer-vision", "yolo", "sam2", "sam3", "supervision", "roi", "coordinate-picker", "coordinates", "visual-prompt"]
authors = [
    { name = "K-saif", email = "khansf466@gmail.com" }
]
maintainers = [
    { name = "K-saif", email = "khansf466@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "opencv-python>=4.5",
    "numpy>=1.21",
]

[project.urls]
Homepage = "https://github.com/K-saif/pixpick"
Documentation = "https://k-saif.github.io/pixpick/"
"Bug Tracker" = "https://github.com/K-saif/pixpick/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["pixpick*"]

[tool.pytest.ini_options]
testpaths = ["tests"]